apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  annotations: 
    kubernetes.io/change-cause: "Initial version 1.19"
spec:
  selector:
    matchLabels:
      app: nginx
  replicas: 3
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx-container
        image: nginx:1.19
        ports:
        - containerPort: 80
