apiVersion: v1
kind: Pod
metadata:
  name: downwardapi-demo
spec:
  containers:
  - name: busybox
    image: busybox
    command: ["sh","-c","env && sleep 3600"]
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef: 
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace