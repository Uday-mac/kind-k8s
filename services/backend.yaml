apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deoploy
  labels:
    app: backend-app
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      containers:
      - name: backend-container
        image: hashicorp/http-echo
        args:
        - "-text=Hello from backend"
        ports:
        - containerPort: 5678

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 5678
    protocol: TCP
  selector:
    app: backend-app
  
