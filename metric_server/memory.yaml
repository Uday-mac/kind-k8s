apiVersion: v1
kind: Pod
metadata:
  name: memory-stress
  labels:
    app.kubernetes.io/name: myapp
spec:
  containers:
  - name: stress
    image: polinux/stress
    resources:
      requests:
        memory: "100Mi"
      limits:
        memory: "200Mi"
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "190M", "--vm-hang", "1"]
