apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
spec:
  selector:
    matchLabels:
      app: nginx-frontend
  template:
    metadata:
      labels:
        app: nginx-frontend
    spec:
      containers:
      - name: nginx
        image: ngin
        resources:
          requests:
            cpu: 100m
            memory: 126Mi
          limits:
            cpu: 200m
            memory: 256Mi
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-frontend-svc
spec:
  type: NodePort
  selector:
    app: nginx-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 31000

