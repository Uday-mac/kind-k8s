apiVersion: v1
kind: Pod
metadata:
  name: init-demo
  tier: frontend
spec:
  initContainers:
    - name: curl
      image: curlimages/curl:7.85.0
      command:
      - sh
      - -c
      - |
        echo "Waiting for the service to be available..."
        sleep 25
        until curl -s https://kubernetes.io > /dev/null; do
          echo "Service not available yet. Retrying in 5 seconds..."
          sleep 5
        done
        echo "Service is now available!"
  containers:
  - name: nginx
    image: nginx


