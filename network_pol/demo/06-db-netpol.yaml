apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-netpol
  namespace: app1-ns
spec:
  podSelector:
    matchLabels:
      app: app1
      type: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: app1
              type: backend
      ports:
      - name:  db-port
        port:  3306
        protocol: TCP