kind: Service
apiVersion: v1
metadata:
  name: db-svc
  namespace: app1-ns
spec:
  selector:
    app: app1
    type: db
  clusterIP: None
  ports:
  - name: db-port
    protocol: TCP    
    port:  3306
    targetPort: 3306

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-sts
  namespace: app1-ns
spec:
  selector:
    matchLabels:
      app: app1
      type: db
  serviceName: db-svc
  replicas: 1
  template:
    metadata:
      labels:
        app: app1
        type: db
    spec:
      containers:
      - name: db-container
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
          - name: "MYSQL_ROOT_PASSWORD"
            value: "password123"