apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deploy
  namespace: app1-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
      type: backend
  template:
    metadata:
      labels:
        app: app1
        type: backend
    spec:
      containers:
      - name: backend-container
        image: python:3.11-slim
        command: ["python","-m","http.server","5678"]
        ports:
          - containerPort: 5678


---
kind: Service
apiVersion: v1
metadata:
  name: backend-svc
  namespace: app1-ns
spec:
  selector:
    app: app1
    type: backend
  type: ClusterIP
  ports:
  - name: backend-port
    protocol: TCP
    port:  5678
    targetPort: 5678