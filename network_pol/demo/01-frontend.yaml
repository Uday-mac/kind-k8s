apiVersion: apps/v1
kind: Deployment
metadata:
  name:  frontend-deploy
  namespace: app1-ns
  labels:
    app: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
      type: frontend
  template:
    metadata:
      labels:
        app:  app1
        type: frontend
    spec:
      containers:
      - image: nginx
        name:  frontend-container
        resources:
          requests:
            cpu: "20m"
            memory: "55M"
          limits:
            cpu: "100m"
            memory: "128Mi"       
        ports:
        - containerPort: 80

---
kind: Service
apiVersion: v1
metadata:
  name: frontend-svc
  namespace: app1-ns
spec:
  selector:
    app: app1
    type: frontend
  type: NodePort
  ports:
  - name: frontend-port
    protocol: TCP
    port:  80
    targetPort: 8080
    nodePort: 31000