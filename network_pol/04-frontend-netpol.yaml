apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-netpol
  namespace: app1-ns
spec:
  podSelector:
    matchLabels:
      app: app1
      type: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
      - name:  http
        port:  31000
        protocol: TCP