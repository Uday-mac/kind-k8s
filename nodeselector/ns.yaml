apiVersion: apps/v1
kind: Deployment
metadata:
  name: ns-deploy
spec:
  selector:
    matchLabels:
      app: mginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx-container
        image: nginx
        ports:
        - containerPort: 80
      nodeSelector:
        storage: ssd
        env: prod
