apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: mysql-cluster
  region: ap-southeast-2
  tags:
    name: uday-statefulset
    bu: uday
    project: stateful-training

availabilityZones: ["ap-southeast-2a", "ap-southeast-2b", "ap-southeast-2c"]  

iam:
  withOIDC: true

nodeGroups:
  - name: stateful-worker-nodes
    availabilityZones: ["ap-southeast-2a", "ap-southeast-2b", "ap-southeast-2c"]
    instanceType: t3.small
    minSize: 4
    maxSize: 5
    privateNetworking: true
    volumeSize: 20
    iam:
      withAddonPolicies:
        autoScaler: true
        externalDNS: false
        certManager: false
        ebs: true
        fsx: false
        efs: false
        albIngress: true
        xRay: false
        cloudWatch: false
    labels:
      lifecycle: ec2-autoscaler